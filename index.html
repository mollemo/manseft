<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#CC1F1F">
<title>Manse – kausi</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root {
    --red: #CC1F1F; --darkred: #991515; --deep: #7E1111;
    --green: #1A7A40; --navy: #1A1A44; --blue: #333399;
    --bg: #F7F2F2; --card: #FFFFFF; --text: #1A1A2E; --sub: #6B6B76; --border: #EADADA;
    --now-bg: #FFF7E0; --now-border: #E8A800; --amber: #A87800;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: var(--bg); color: var(--text); padding-bottom: 48px; -webkit-text-size-adjust: 100%; }
  button, input, select { font: inherit; }

  .topbar { position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  header { background: var(--red); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header .logo { width: 48px; height: 48px; min-width: 48px; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,.25); background: #fff; }
  header h1 { font-size: 19px; font-weight: 700; line-height: 1.2; }
  header .clock { font-size: 12.5px; opacity: .9; margin-top: 2px; }

  .tabs { display: flex; background: var(--darkred); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; white-space: nowrap; padding: 11px 13px; color: rgba(255,255,255,.72); font-weight: 600;
         font-size: 13.5px; border: none; background: transparent; border-bottom: 3px solid transparent; cursor: pointer; }
  .tab.active { color: #fff; border-bottom-color: #fff; background: rgba(255,255,255,.08); }
  .tab .cnt { display: inline-block; min-width: 17px; padding: 0 5px; margin-left: 4px; border-radius: 9px;
              background: #FFD24A; color: var(--deep); font-size: 10.5px; font-weight: 800; line-height: 17px; }
  @media (max-width: 430px) { .tab { font-size: 12.5px; padding: 10px 10px; } }

  main { max-width: 600px; margin: 0 auto; padding: 14px 12px; }
  main.busy button { pointer-events: none; opacity: .6; }

  .h2 { font-size: 16px; font-weight: 700; color: var(--red); margin: 18px 4px 8px; display: flex; align-items: center; gap: 8px; }
  .h2.navy { color: var(--navy); }
  .h3 { font-size: 12.5px; font-weight: 700; color: var(--sub); margin: 12px 4px 5px; text-transform: uppercase; letter-spacing: .4px; }
  .muted { color: var(--sub); }
  .small { font-size: 12.5px; }
  .note { font-size: 13px; color: var(--sub); margin: 4px 4px 10px; line-height: 1.5; }

  .banner { border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 13.5px; font-weight: 600; line-height: 1.45; border: 2px solid; }
  .banner.warn  { background: var(--now-bg); border-color: var(--now-border); color: var(--amber); }
  .banner.ok    { background: #E8F5EC; border-color: var(--green); color: var(--green); }
  .banner.err   { background: #FCEBEB; border-color: var(--red); color: var(--darkred); }
  .banner.lock  { background: #EDEEF3; border-color: var(--navy); color: var(--navy); }
  .banner.demo  { background: #EEF2FF; border-color: #8C9BE0; color: #2D3A8C; font-weight: 500; }
  .banner b { font-weight: 800; }

  .card { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--border);
          border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .card.past { opacity: .55; }
  .card.today { border: 2px solid var(--now-border); background: var(--now-bg); }
  .card.hero { border: 2px solid var(--red); box-shadow: 0 3px 12px rgba(204,31,31,.12); }
  .datebox { width: 46px; min-width: 46px; text-align: center; border-radius: 10px; padding: 5px 0; color: #fff; background: var(--red); }
  .datebox.away { background: var(--navy); }
  .datebox.talkoo { background: var(--green); }
  .datebox.event { background: var(--blue); }
  .datebox .wd { font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: .9; }
  .datebox .dm { font-size: 15px; font-weight: 800; line-height: 1.15; }
  .datebox .ic { font-size: 13px; margin-top: 1px; }
  .cbody { flex: 1; min-width: 0; }
  .meta { font-size: 12px; font-weight: 700; color: var(--red); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  .title { font-size: 15.5px; font-weight: 700; line-height: 1.35; margin-top: 1px; }
  .sub { font-size: 12.8px; color: var(--sub); margin-top: 3px; line-height: 1.5; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 9px; text-transform: uppercase; letter-spacing: .3px; }
  .b-home { background: #FBE3E3; color: var(--darkred); }
  .b-away { background: #E3E4F2; color: var(--navy); }
  .b-ser  { background: #F1EEE6; color: #6B5A2E; }
  .b-today { background: var(--now-border); color: #fff; }
  .b-res  { background: var(--navy); color: #fff; font-size: 12px; }

  a.lnk { color: var(--red); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  a.lnk.navy { color: var(--navy); }

  .roles { margin-top: 7px; border-top: 1px dashed var(--border); padding-top: 4px; }
  .rrow { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; margin-top: 5px; font-size: 13.5px; }
  .rrow .rl { font-weight: 700; min-width: 0; }
  .open { color: var(--red); font-weight: 700; }
  .btn { font-size: 12.5px; font-weight: 700; color: #fff; background: var(--red); border: 1px solid var(--red);
         border-radius: 8px; padding: 4px 11px; cursor: pointer; }
  .btn.ghost { color: var(--red); background: #fff; font-weight: 600; }
  .btn.navy { background: var(--navy); border-color: var(--navy); }
  .btn.navy.ghost { color: var(--navy); background: #fff; }
  .btn.sm { padding: 2px 8px; font-size: 11.5px; }
  .x { border: none; background: none; color: var(--sub); font-size: 15px; cursor: pointer; padding: 0 3px; line-height: 1; }
  .inp { font-size: 15px; padding: 5px 9px; border: 1px solid var(--red); border-radius: 8px; width: 160px; max-width: 100%; }
  .inp.wide { width: 100%; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 2px 10px; }
  .chip { font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 16px; border: 1px solid var(--border);
          background: #fff; color: var(--text); cursor: pointer; }
  .chip.on { background: var(--red); color: #fff; border-color: var(--red); }

  .mini { display: flex; gap: 10px; align-items: baseline; padding: 7px 2px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .mini:last-child { border-bottom: none; }
  .mini .md { min-width: 66px; font-weight: 700; color: var(--red); font-size: 12.5px; }
  .mini .mt { flex: 1; min-width: 0; }
  .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; }

  .ride { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-top: 7px; background: #FBFAFF; font-size: 13.5px; }
  .ride .rh { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .seats { font-size: 12px; font-weight: 700; color: var(--green); }
  .seats.full { color: var(--sub); }
  .pas { display: inline-flex; align-items: center; background: #EEF0F8; border-radius: 12px; padding: 1px 4px 1px 9px; margin: 4px 4px 0 0; font-size: 12.5px; }
  .form { display: grid; gap: 7px; margin-top: 8px; }
  .form label { font-size: 12px; font-weight: 700; color: var(--sub); }

  .sec { border-radius: 14px; overflow: hidden; margin: 16px 0; background: #FCFAFA; border: 1px solid var(--border); }
  .sech { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 11px 14px; color: #fff; background: var(--red); }
  .sec-1 .sech { background: var(--green); }
  .sec-2 .sech { background: var(--navy); }
  .sec-3 .sech { background: #5C5C66; }
  .sect { font-size: 17px; font-weight: 800; line-height: 1.2; }
  .secm { font-size: 12px; opacity: .9; margin-top: 2px; }
  .secpill { background: #FFD24A; color: var(--deep); font-weight: 800; font-size: 12px; padding: 3px 9px; border-radius: 12px; white-space: nowrap; }
  .secpill.ok { background: rgba(255,255,255,.22); color: #fff; }
  .secb { padding: 2px 10px 12px; }
  .secb .h3 { margin-top: 12px; }
  .secb .box { margin-bottom: 4px; }
  .more { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

  .tile { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #fff; color: var(--text);
          border: 1px solid var(--border); border-left: 6px solid var(--red); border-radius: 12px; padding: 9px 12px; margin-bottom: 7px; cursor: pointer; }
  .tile.c1 { border-left-color: var(--green); }
  .tile.c2 { border-left-color: var(--navy); }
  .tile.c3 { border-left-color: #8A8A94; }
  .tile:active { background: #FBF5F5; }
  .tile .ti { font-size: 20px; line-height: 1; }
  .tile .tb { flex: 1; min-width: 0; display: block; }
  .tile .tn { display: block; font-weight: 800; font-size: 15px; line-height: 1.25; }
  .tile .tx { display: block; font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .tile .tp { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; white-space: nowrap; background: #FFF0C2; color: var(--amber); }
  .tile .tp.lock { background: #EDEEF3; color: var(--navy); }
  .tile .tp.ok { background: #E8F5EC; color: var(--green); }
  .tile .chev { color: var(--sub); font-size: 20px; line-height: 1; }
  .back { margin: 2px 0 4px; }

  details.ohje { display: block; cursor: pointer; }
  details.ohje summary { list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.ohje summary::-webkit-details-marker { display: none; }
  details.ohje summary::after { content: "›"; color: var(--sub); font-size: 20px; transition: transform .15s; }
  details.ohje[open] summary::after { transform: rotate(90deg); }
  details.ohje[open] { border-color: var(--red); }

  .tile.live { background: var(--now-bg); border-color: var(--now-border); border-left-color: var(--now-border); }
  header { position: relative; }
  .menubtn { margin-left: auto; background: rgba(255,255,255,.16); border: none; color: #fff; font-size: 21px; width: 42px; height: 42px; border-radius: 10px; cursor: pointer; }
  .menu { position: absolute; right: 10px; top: 64px; background: #fff; border-radius: 12px; box-shadow: 0 8px 26px rgba(0,0,0,.25); min-width: 240px; z-index: 30; overflow: hidden; }
  .menu button { display: block; width: 100%; text-align: left; padding: 12px 15px; border: none; border-bottom: 1px solid var(--border); background: #fff; color: var(--text); font-weight: 600; font-size: 14.5px; cursor: pointer; }
  .menu button:last-child { border-bottom: none; }
  .menu .mh { padding: 8px 15px 4px; font-size: 11px; font-weight: 800; color: var(--sub); text-transform: uppercase; letter-spacing: .4px; background: #FAF6F6; }
  .menu small { display: block; color: var(--sub); font-weight: 500; font-size: 12px; }
  .camphead { border-radius: 14px; margin: 4px 0 10px; }
  .tl { display: flex; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--border); }
  .tl:last-child { border-bottom: none; }
  .tl .tt { min-width: 50px; font-weight: 800; color: var(--red); font-size: 13px; padding-top: 1px; }
  .tl .tic { font-size: 18px; line-height: 1.2; }
  .tl .tc { flex: 1; min-width: 0; }
  .tl .tti { font-weight: 700; font-size: 14.5px; line-height: 1.35; }
  .tl .tsu { font-size: 12.8px; color: var(--sub); margin-top: 2px; line-height: 1.5; white-space: pre-line; }
  .tl.meal .tt { color: var(--green); }
  .tl.past { opacity: .5; }

  .news { border-left: 4px solid var(--red); }
  .news .title { font-size: 14.5px; }
  .news .sub { white-space: pre-line; color: var(--text); }

  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--navy); color: #fff;
           padding: 9px 16px; border-radius: 20px; font-size: 13.5px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.25);
           opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: 92vw; text-align: center; }
  #toast.show { opacity: 1; }
  footer { text-align: center; font-size: 11px; color: #AAA; margin-top: 26px; }
</style>
</head>
<body>

<div class="topbar">
  <header>
    <img class="logo" src="logo.png" alt="">
    <div>
      <h1 id="teamTitle">Manse</h1>
      <div class="clock" id="clock"></div>
    </div>
    <button class="menubtn" id="menuBtn" data-act="menu" aria-label="Valikko">☰</button>
    <div class="menu" id="menu" hidden></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
</div>

<main id="view"></main>
<div id="toast"></div>

<script>
// ═════════════════════════════════════════════════════════════════════════
//  ASETUS: Apps Scriptin /exec-osoite. Tyhjänä sivu näyttää esimerkkidataa.
// ═════════════════════════════════════════════════════════════════════════
const API_URL = "";

const DEMO = !API_URL;
const TABS = [
  ["koti", "🏠 Etusivu"], ["ottelut", "⚾ Ottelut"], ["talkoot", "🙋 Talkoot"],
  ["kyydit", "🚗 Kyydit"], ["kalenteri", "📅 Kalenteri"], ["ohjeet", "📖 Ohjeet"],
];

let D = null;            // haettu data
let loadError = false;
let busy = false;        // tallennus käynnissä
let editing = null;      // { key, value }  – avoin syöttökenttä
const touched = new Set(); // tällä käyntikerralla muokatut vuorot pysyvät näkyvissä Avoimet-suodattimessa
function parseHash() {
  let h = location.hash.slice(1);
  try { h = decodeURIComponent(h); } catch (e) {}
  if (h.startsWith("leiri=")) return { tab: "leiri", leiri: h.slice(6) };
  return { tab: TABS.some(t => t[0] === h) ? h : "koti" };
}
let tab = parseHash().tab;
const F = { leiri: parseHash().leiri || "", lday: "", menu: false, ohje: "", games: "tulevat", sec: "", talkoot: "avoimet", kal: "kaikki", kalPast: false, mePast: false };

// ─── Apufunktiot ─────────────────────────────────────────────────────────
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const WD = ["Su", "Ma", "Ti", "Ke", "To", "Pe", "La"];
const MONTHS = ["Tammikuu", "Helmikuu", "Maaliskuu", "Huhtikuu", "Toukokuu", "Kesäkuu", "Heinäkuu", "Elokuu", "Syyskuu", "Lokakuu", "Marraskuu", "Joulukuu"];

function nowFi() { return new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Helsinki" })); }
function isoOf(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function todayIso() { return isoOf(nowFi()); }
function dOf(iso) { const [y, m, d] = String(iso).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function wd(iso) { return WD[dOf(iso).getDay()]; }
function dm(iso) { const d = dOf(iso); return d.getDate() + "." + (d.getMonth() + 1) + "."; }
function dayLabel(iso) { return wd(iso) + " " + dm(iso); }
function daysUntil(iso) { return Math.round((dOf(iso) - dOf(todayIso())) / 864e5); }
function isPast(iso) { return iso < todayIso(); }
function toMin(t) { const m = String(t || "").match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; }
function relDay(iso, time) {
  const n = daysUntil(iso);
  if (n === 0) {
    const left = toMin(time) != null ? toMin(time) - (nowFi().getHours() * 60 + nowFi().getMinutes()) : null;
    if (left != null && left > 0) return left < 120 ? `Alkaa ${left} min päästä` : `Tänään, ${Math.floor(left / 60)} h päästä`;
    return "Tänään";
  }
  if (n === 1) return "Huomenna";
  if (n > 1) return `${n} päivän päästä`;
  return "";
}
function byWhen(a, b) { return (a.date + (a.time || "99")).localeCompare(b.date + (b.time || "99")); }
function myName() { try { return localStorage.getItem("kausi_nimi") || ""; } catch (e) { return ""; } }
function setMyName(n) { try { localStorage.setItem("kausi_nimi", n); } catch (e) {} }
function toast(msg, ms) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms || 2600);
}
const locked = () => !!(D && D.locked);

// ─── Paikat ja kartat ────────────────────────────────────────────────────
function fieldByName(name) {
  const n = String(name || "").trim().toLowerCase();
  return n ? (D.fields || []).find(f => f.name.toLowerCase() === n) || null : null;
}
function mapUrl(q) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
function placeHtml(name) {
  if (!name) return "";
  const f = fieldByName(name);
  const addr = f && f.address ? f.address : name;
  const extra = f ? [f.address, f.surface].filter(Boolean).join(" · ") : "";
  return `📍 <a class="lnk" href="${esc(mapUrl(addr))}" target="_blank" rel="noopener">${esc(name)}</a>`
       + (extra && extra !== name ? `<br><span class="small">${esc(extra)}</span>` : "");
}

// ─── Osiot (Aluesarja, Alueleiri, …) ─────────────────────────────────────
const OTHER = "Yleiset";
function sections() { return (D.settings && D.settings.sections) || []; }
function secName(x) { return x && x.section && sections().includes(x.section) ? x.section : OTHER; }
function sectionList() {
  const l = sections().slice();
  if ([].concat(D.games, D.talkoot, D.events).some(x => secName(x) === OTHER)) l.push(OTHER);
  return l;
}
function secLockedName(s) { return ((D.settings && D.settings.lockedSections) || []).some(x => x.toLowerCase() === String(s).toLowerCase()); }
// Talkooilmoittautuminen suljettu: koko lista lukittu tai rivin osio on Lukitut osiot -listalla
function talkooLocked(x) { return locked() || secLockedName(secName(x)); }
function secOk(x) { return !F.sec || secName(x) === F.sec; }
function secIcon(s) { s = s.toLowerCase(); return s.includes("leiri") ? "⛺" : s.includes("sarja") ? "⚾" : "📌"; }
function secChips() {
  const l = sectionList();
  return l.length > 1 ? chips("sec", [["", "Kaikki"]].concat(l.map(x => [x, secIcon(x) + " " + esc(x)])), F.sec) : "";
}

// ─── Laskurit ────────────────────────────────────────────────────────────
function gameOpen(g) { return Object.keys(g.roles).filter(r => !g.roles[r]).length; }
function talkooOpen(t) { return Math.max(t.need - t.names.length, 0); }
function openTotals() {
  const g = D.games.filter(x => !isPast(x.date)).reduce((s, x) => s + gameOpen(x), 0);
  const t = D.talkoot.filter(x => !isPast(x.date)).reduce((s, x) => s + talkooOpen(x), 0);
  return { games: g, talkoot: t, all: g + t };
}
function ridesFor(id) { return (D.rides || []).filter(r => r.target === id); }
function rideTargets() {
  const t = D.games.filter(g => g.rides).map(g => ({ kind: "game", id: g.id, date: g.date, time: g.time, title: g.teams, place: g.field, ref: g }))
    .concat(D.events.filter(e => e.rides).map(e => ({ kind: "event", id: e.id, date: e.date, time: e.time, title: e.title, place: e.place, ref: e })));
  return t.sort(byWhen);
}

// ─── Datan haku ──────────────────────────────────────────────────────────
async function load(silent) {
  if (DEMO) { if (!D) D = makeDemo(); render(); return; }
  try {
    const res = await fetch(API_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data.ok === false) throw new Error(data.error || "virhe");
    D = data; loadError = false;
  } catch (err) {
    console.warn("Haku epäonnistui:", err);
    loadError = true;
  }
  if (!silent) render();
}

async function act(body) {
  if (locked()) { toast("🔒 Lista on lukittu"); return; }
  if (body.id) touched.add(body.id);
  busy = true; render(); toast("⏳ Tallennetaan…", 8000);
  let res = null;
  if (DEMO) { await sleep(250); res = demoHandle(body); }
  else {
    try {
      const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
      res = await r.json().catch(() => null);
    } catch (err) { console.warn("Tallennus:", err); }
    await sleep(300);
    await load(true);
  }
  busy = false;
  if (res && res.ok === false) toast("⚠️ " + (res.error || "Tallennus ei onnistunut"), 4000);
  else toast("✅ Tallennettu");
  render();
}

// ─── Syöttökentät (ilmoittautuminen) ─────────────────────────────────────
function startEdit(key, value) {
  if (locked()) return;
  editing = { key, value: value != null ? value : myName() };
  render();
  setTimeout(() => { const el = document.getElementById("inl"); if (el) { el.focus(); try { el.select(); } catch (e) {} } }, 0);
}
function inlineInput(placeholder) {
  return `<input id="inl" class="inp" type="text" maxlength="60" value="${esc(editing.value)}" placeholder="${esc(placeholder || "Nimi")}" autocomplete="name">
          <button class="btn" data-act="save">Tallenna</button>
          <button class="btn ghost" data-act="cancel">Peruuta</button>`;
}
async function saveEdit() {
  const el = document.getElementById("inl");
  if (!el || !editing) return;
  const v = el.value.trim();
  const [type, id, extra] = editing.key.split("|");
  if (!v) { editing = null; render(); return; }
  if (type === "role") {
    const g = D.games.find(x => x.id === id);
    const old = g ? g.roles[extra] : "";
    if (old && old !== v && !confirm(`Korvataanko ${old} nimellä ${v}?`)) return;
    setMyName(v); editing = null;
    await act({ action: "role", id, role: extra, name: v });
  } else if (type === "talkoo") {
    setMyName(v); editing = null;
    await act({ action: "talkoo_add", id, name: v });
  } else if (type === "join") {
    editing = null;
    await act({ action: "ride_join", id, name: v });
  }
}
async function submitRide(target) {
  const n = (document.getElementById("rName") || {}).value || "";
  const seats = parseInt((document.getElementById("rSeats") || {}).value, 10) || 1;
  const depart = (document.getElementById("rDepart") || {}).value || "";
  if (!n.trim()) { document.getElementById("rName").focus(); return; }
  setMyName(n.trim()); editing = null;
  await act({ action: "ride_add", target, driver: n.trim(), seats, depart: depart.trim() });
}

// ─── Komponentit ─────────────────────────────────────────────────────────
function dateBox(iso, cls, icon) {
  return `<div class="datebox ${cls || ""}"><div class="wd">${wd(iso)}</div><div class="dm">${dm(iso)}</div>${icon ? `<div class="ic">${icon}</div>` : ""}</div>`;
}

function roleRow(g, role) {
  const key = `role|${g.id}|${role}`;
  const name = g.roles[role] || "";
  let body;
  if (editing && editing.key === key) body = inlineInput("Nimi");
  else if (isPast(g.date)) body = name ? esc(name) : `<span class="muted">—</span>`;
  else if (talkooLocked(g)) body = name ? esc(name) : `<span class="muted">Jakamatta</span>`;
  else if (name) body = `${esc(name)} <button class="btn ghost sm" data-act="edit" data-key="${esc(key)}" data-val="${esc(name)}">Vaihda</button>
                         <button class="x" title="Poista" data-act="rmRole" data-key="${esc(key)}">✕</button>`;
  else body = `<span class="open">Avoin</span> <button class="btn sm" data-act="edit" data-key="${esc(key)}">Ilmoittaudu</button>`;
  const o = ohjeFor(role);
  return `<div class="rrow"><span class="rl">${esc(role)}${o ? ` <button class="x" style="font-size:13px;color:var(--navy);" title="Ohje" data-act="ohje" data-key="${esc(o.title)}">ⓘ</button>` : ""}:</span> ${body}</div>`;
}

function gameCard(g, opts) {
  opts = opts || {};
  const past = isPast(g.date), today = g.date === todayIso();
  const meta = [
    g.time ? `klo ${esc(g.time)}` : "",
    `<span class="badge ${g.home ? "b-home" : "b-away"}">${g.home ? "Koti" : "Vieras"}</span>`,
    g.series ? `<span class="badge b-ser">${esc(g.series)}</span>` : "",
    today ? `<span class="badge b-today">Tänään</span>` : "",
  ].filter(Boolean).join(" ");
  const roles = Object.keys(g.roles);
  const rides = g.rides ? ridesFor(g.id) : [];
  const free = rides.reduce((s, r) => s + Math.max(r.seats - r.passengers.length, 0), 0);
  const rel = opts.rel ? relDay(g.date, g.time) : "";
  return `<div class="card ${past ? "past" : ""} ${today ? "today" : ""} ${opts.hero ? "hero" : ""}">
    ${dateBox(g.date, g.home ? "" : "away", "⚾")}
    <div class="cbody">
      <div class="meta">${meta}</div>
      <div class="title">${esc(g.teams)} ${g.result ? `<span class="badge b-res">${esc(g.result)}</span>` : ""}</div>
      ${rel ? `<div class="sub" style="color:var(--amber);font-weight:700;">${esc(rel)}</div>` : ""}
      ${g.field ? `<div class="sub">${placeHtml(g.field)}</div>` : ""}
      ${g.info ? `<div class="sub">${esc(g.info)}</div>` : ""}
      ${g.link ? `<div class="sub"><a class="lnk" href="${esc(g.link)}" target="_blank" rel="noopener">📋 Pesistulokset</a></div>` : ""}
      ${roles.length ? `<div class="roles">${roles.map(r => roleRow(g, r)).join("")}</div>` : ""}
      ${g.rides && !past && !opts.noRides ? `<div class="sub" style="margin-top:6px;">🚗 ${rides.length
          ? `${rides.length} ${rides.length === 1 ? "auto" : "autoa"}, vapaita paikkoja ${free}`
          : "Ei vielä kyytitarjouksia"} · <a class="lnk navy" href="#kyydit" data-act="tab" data-key="kyydit">Kyydit</a></div>` : ""}
    </div></div>`;
}

function talkooCard(t) {
  const past = isPast(t.date), today = t.date === todayIso();
  const open = talkooOpen(t);
  const key = `talkoo|${t.id}`;
  const time = t.time ? `klo ${esc(t.time)}${t.end ? "–" + esc(t.end) : ""}` : "";
  const names = t.names.map(n => `<span class="pas">${esc(n)}${!past && !talkooLocked(t) ? `<button class="x" title="Poista" data-act="rmTalkoo" data-key="${esc(t.id + "|" + n)}">✕</button>` : ""}</span>`).join("");
  let action = "";
  if (editing && editing.key === key) action = `<div class="rrow">${inlineInput("Nimi")}</div>`;
  else if (!past && open > 0 && talkooLocked(t)) action = `<div class="rrow"><span class="muted">${open} jakamatta</span></div>`;
  else if (!past && open > 0) action = `<div class="rrow"><span class="open">${open} ${open === 1 ? "paikka" : "paikkaa"} vapaana</span>
       <button class="btn sm" data-act="edit" data-key="${esc(key)}">Ilmoittaudu</button></div>`;
  else if (open === 0) action = `<div class="rrow" style="color:var(--green);font-weight:700;font-size:12.5px;">✓ Täynnä</div>`;
  return `<div class="card ${past ? "past" : ""} ${today ? "today" : ""}">
    ${dateBox(t.date, "talkoo", "🙋")}
    <div class="cbody">
      <div class="meta" style="color:var(--green);">${time}${t.event ? ` <span class="badge b-ser">${esc(t.event)}</span>` : ""}${today ? ` <span class="badge b-today">Tänään</span>` : ""}</div>
      <div class="title">${esc(t.task || "Talkoovuoro")}</div>
      ${t.place ? `<div class="sub">${placeHtml(t.place)}</div>` : ""}
      ${t.info ? `<div class="sub">${esc(t.info)}</div>` : ""}
      <div class="roles"><div class="small muted" style="margin-top:3px;">Ilmoittautuneet ${t.names.length}/${t.need}</div>
        <div>${names}</div>${action}</div>
    </div></div>`;
}

const EVENT_ICONS = { harjoitus: "🏃", turnaus: "🏆", leiri: "⛺", ohjelma: "🎯", majoitus: "🛏️", ruokailu: "🍽️", palaveri: "💬", varainhankinta: "💶", juhla: "🎉" };
function eventIcon(e) { return EVENT_ICONS[String(e.type || "").toLowerCase()] || "📌"; }
function eventCard(e) {
  const past = isPast(e.date), today = e.date === todayIso();
  const time = e.time ? `klo ${esc(e.time)}${e.end ? "–" + esc(e.end) : ""}` : "";
  return `<div class="card ${past ? "past" : ""} ${today ? "today" : ""}">
    ${dateBox(e.date, "event", eventIcon(e))}
    <div class="cbody">
      <div class="meta" style="color:var(--blue);">${time}${e.type ? ` <span class="badge b-ser">${esc(e.type)}</span>` : ""}${today ? ` <span class="badge b-today">Tänään</span>` : ""}</div>
      <div class="title">${esc(e.title)}</div>
      ${e.place ? `<div class="sub">${placeHtml(e.place)}</div>` : ""}
      ${e.info ? `<div class="sub" style="white-space:pre-line;">${esc(e.info)}</div>` : ""}
      ${e.link ? `<div class="sub"><a class="lnk" href="${esc(e.link)}" target="_blank" rel="noopener">🔗 Lisätiedot</a></div>` : ""}
      ${e.rides && !past ? `<div class="sub" style="margin-top:6px;">🚗 <a class="lnk navy" href="#kyydit" data-act="tab" data-key="kyydit">Kyydit</a></div>` : ""}
    </div></div>`;
}

function rideBlock(target) {
  const past = isPast(target.date);
  const rides = ridesFor(target.id);
  const canEdit = !past && !locked();
  let html = rides.map(r => {
    const free = Math.max(r.seats - r.passengers.length, 0);
    const jkey = `join|${r.id}`;
    const pas = r.passengers.map(p => `<span class="pas">${esc(p)}${canEdit ? `<button class="x" title="Poista kyydistä" data-act="leave" data-key="${esc(r.id + "|" + p)}">✕</button>` : ""}</span>`).join("");
    let join = "";
    if (editing && editing.key === jkey) join = `<div class="rrow">${inlineInput("Pelaajan nimi")}</div>`;
    else if (canEdit && free > 0) join = `<div class="rrow"><button class="btn navy sm" data-act="edit" data-key="${esc(jkey)}" data-val="">Liity kyytiin</button></div>`;
    return `<div class="ride">
      <div class="rh"><strong>🚗 ${esc(r.driver)}</strong><span class="seats ${free ? "" : "full"}">${free ? `${free} vapaana / ${r.seats}` : "Täynnä"}</span></div>
      ${r.depart ? `<div class="small muted">Lähtö: ${esc(r.depart)}</div>` : ""}
      ${r.info ? `<div class="small muted">${esc(r.info)}</div>` : ""}
      <div>${pas}</div>${join}
      ${canEdit ? `<div style="text-align:right;margin-top:3px;"><button class="x small" style="font-size:11.5px;text-decoration:underline;" data-act="rmRide" data-key="${esc(r.id)}">Poista kyyti</button></div>` : ""}
    </div>`;
  }).join("");
  const fkey = `rideform|${target.id}`;
  if (editing && editing.key === fkey) {
    html += `<div class="ride" style="background:#fff;border-color:var(--navy);">
      <strong>Tarjoa kyytiä</strong>
      <div class="form">
        <div><label for="rName">Kuljettaja</label><br><input id="rName" class="inp wide" maxlength="60" value="${esc(myName())}" placeholder="Nimesi"></div>
        <div><label for="rSeats">Vapaita paikkoja pelaajille (oma lapsi ei mukaan)</label><br><input id="rSeats" class="inp" style="width:80px;" type="number" min="1" max="8" value="3"></div>
        <div><label for="rDepart">Lähtö (paikka ja aika)</label><br><input id="rDepart" class="inp wide" maxlength="80" placeholder="esim. Kaupin kenttä klo 8.30"></div>
        <div><button class="btn navy" data-act="rideSubmit" data-key="${esc(target.id)}">Tallenna</button> <button class="btn navy ghost" data-act="cancel">Peruuta</button></div>
      </div></div>`;
  } else if (canEdit) {
    html += `<div style="margin-top:8px;"><button class="btn navy ghost" data-act="edit" data-key="${esc(fkey)}">＋ Tarjoa kyytiä</button></div>`;
  } else if (!rides.length) {
    html += `<div class="small muted" style="margin-top:6px;">Ei kyytejä.</div>`;
  }
  return html;
}

function miniRow(it) {
  const icon = it.kind === "game" ? "⚾" : it.kind === "talkoo" ? "🙋" : it.kind === "ride" ? "🚗" : eventIcon(it.ref);
  return `<div class="mini"><span class="md">${dayLabel(it.date)}${it.time ? "<br>" + esc(it.time) : ""}</span>
          <span class="mt">${icon} ${esc(it.title)}${it.extra ? `<br><span class="small muted">${it.extra}</span>` : ""}</span></div>`;
}

function allItems() {
  return [].concat(
    D.games.map(g => ({ kind: "game", id: g.id, date: g.date, time: g.time, title: g.teams, place: g.field, ref: g,
                        extra: esc([g.home ? "Koti" : "Vieras", g.series, g.field].filter(Boolean).join(" · ")) })),
    D.talkoot.map(t => ({ kind: "talkoo", id: t.id, date: t.date, time: t.time, end: t.end, title: (t.task || "Talkoot") + (t.event ? " – " + t.event : ""), place: t.place, ref: t,
                          extra: talkooOpen(t) ? `<span class="open">${talkooOpen(t)} vapaana</span>` : "Täynnä" })),
    D.events.map(e => ({ kind: "event", id: e.id, date: e.date, time: e.time, end: e.end, title: e.title, place: e.place, ref: e,
                         extra: esc([e.type, e.place].filter(Boolean).join(" · ")) }))
  ).sort(byWhen);
}

function groupByMonth(items, cardFn) {
  let out = "", last = "";
  items.forEach(it => {
    const d = dOf(it.date), k = d.getFullYear() + "-" + d.getMonth();
    if (k !== last) { out += `<div class="h3">${MONTHS[d.getMonth()]} ${d.getFullYear()}</div>`; last = k; }
    out += cardFn(it);
  });
  return out;
}
function chips(group, options, current) {
  return `<div class="chips">${options.map(([v, l]) => `<button class="chip ${v === current ? "on" : ""}" data-act="filter" data-key="${group}|${esc(v)}">${l}</button>`).join("")}</div>`;
}
function statusBanners() {
  let h = "";
  if (DEMO) h += `<div class="banner demo"><b>Esikatselu:</b> sivulla on esimerkkidataa. Kun Apps Scriptin osoite lisätään koodiin (API_URL), sisältö tulee Google Sheetistä.</div>`;
  if (loadError) h += `<div class="banner err">⚠️ Tietojen päivitys ei juuri nyt onnistu. Yritetään uudelleen automaattisesti.</div>`;
  if (locked()) h += `<div class="banner lock">🔒 Ilmoittautuminen on lukittu. Muutokset sovitaan talkoovastaavan kanssa.</div>`;
  return h;
}

// ─── Välilehdet ──────────────────────────────────────────────────────────
function viewKoti() {
  const t = todayIso();
  let h = statusBanners();

  const news = (D.news || []).filter(n => !n.until || n.until >= t).sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 3);
  news.forEach(n => {
    h += `<div class="card news"><div class="cbody">
      ${n.date ? `<div class="meta">${dayLabel(n.date)}</div>` : ""}
      <div class="title">📣 ${esc(n.title)}</div>${n.text ? `<div class="sub">${esc(n.text)}</div>` : ""}</div></div>`;
  });

  // Leirit näkyvät painikkeina aina leirin loppuun asti; lähestyvä tai käynnissä oleva leiri korostetaan ja nostetaan ylös.
  const tiles = sectionList().filter(x => !isCamp(x) || !campInfo(x).start || campInfo(x).end >= t)
    .sort((a, b) => (isCamp(b) && campVisible(b) ? 1 : 0) - (isCamp(a) && campVisible(a) ? 1 : 0));
  h += `<div class="h2">Kausi</div>` + tiles.map(x => sectionTile(x)).join("");
  h += myBlock();

  return h;
}

function secColor(s) { const i = sections().indexOf(s); return i === -1 ? 3 : i % 3; }
function secStatus(s) {
  const t = todayIso();
  const upG = D.games.filter(g => secName(g) === s && g.date >= t);
  const upT = D.talkoot.filter(x => secName(x) === s && x.date >= t);
  return {
    open: upG.reduce((n, g) => n + gameOpen(g), 0) + upT.reduce((n, x) => n + talkooOpen(x), 0),
    has: upG.some(g => Object.keys(g.roles).length) || upT.length > 0,
    locked: locked() || secLockedName(s),
  };
}
function sectionTile(s) {
  const t = todayIso();
  const items = allItems().filter(it => secName(it.ref) === s);
  const next = items.find(it => it.date >= t);
  const st = secStatus(s);
  const pill = !st.has ? "" : st.locked
    ? `<span class="tp lock">${st.open ? `🔒 ${st.open} jakamatta` : "🔒 jaettu"}</span>`
    : st.open ? `<span class="tp">🙋 ${st.open} avointa</span>` : `<span class="tp ok">✓ täynnä</span>`;
  const line = next
    ? `${esc(daysUntil(next.date) <= 1 ? relDay(next.date, next.time) : dayLabel(next.date))}${next.time && !relDay(next.date, next.time).startsWith("Alkaa") ? " klo " + esc(next.time) : ""} · ${esc(next.title)}`
    : items.length ? "Ei tulevaa ohjelmaa" : "Ei vielä ohjelmaa";
  const camp = isCamp(s), live = camp && campLive(s), near = camp && campVisible(s);
  return `<button class="tile c${secColor(s)} ${near ? "live" : ""}" data-act="${camp ? "openLeiri" : "openSec"}" data-key="${esc(s)}">
    <span class="ti">${secIcon(s)}</span>
    <span class="tb"><span class="tn">${esc(s)}${live ? " · käynnissä" : ""}</span><span class="tx">${live ? "Avaa leirin ohjelma ja ruokalista" : camp ? esc([campLabel(s), campRange(s)].filter(Boolean).join(" · ")) + (daysUntil(campInfo(s).start) > 0 ? ` · alkaa ${daysUntil(campInfo(s).start) === 1 ? "huomenna" : daysUntil(campInfo(s).start) + " pv päästä"}` : "") : line}</span></span>
    ${pill}<span class="chev">›</span></button>`;
}
function viewOsio() {
  const s = F.sec || OTHER;
  return statusBanners() + `<div class="back"><button class="btn ghost sm" data-act="tab" data-key="koti">← Etusivu</button></div>` + sectionBlock(s, secColor(s));
}

function sectionBlock(s, color) {
  const t = todayIso();
  const games = D.games.filter(g => secName(g) === s);
  const talk = D.talkoot.filter(x => secName(x) === s);
  const evs = D.events.filter(e => secName(e) === s);
  const dates = [].concat(games, talk, evs).map(x => x.date).sort();
  const upGames = games.filter(g => g.date >= t).sort(byWhen);
  const upEvs = evs.filter(e => e.date >= t).sort(byWhen);
  const openG = upGames.reduce((n, g) => n + gameOpen(g), 0);
  const openT = talk.filter(x => x.date >= t).reduce((n, x) => n + talkooOpen(x), 0);
  const open = openG + openT;
  const hasTalkoot = upGames.some(g => Object.keys(g.roles).length) || talk.some(x => x.date >= t);
  const secLocked = locked() || secLockedName(s);
  const range = !dates.length ? "" : dates[0] === dates[dates.length - 1] ? dayLabel(dates[0]) : dm(dates[0]) + "–" + dm(dates[dates.length - 1]);
  const metaBits = [range, games.length ? `${upGames.length}/${games.length} ottelua tulossa` : ""].filter(Boolean).join(" · ");

  let b = "";
  if (!dates.length) b += `<p class="note" style="margin-top:10px;">Ei vielä ohjelmaa.</p>`;

  // Ottelut
  if (games.length) {
    b += `<div class="h3">⚾ Ottelut</div>`;
    if (upGames.length) {
      b += gameCard(upGames[0], { hero: true, rel: true });
      if (upGames.length > 1) b += `<div class="box">${upGames.slice(1, 4).map(g => miniRow({ kind: "game", date: g.date, time: g.time, title: g.teams, ref: g,
        extra: esc([g.home ? "Koti" : "Vieras", g.field].filter(Boolean).join(" · ")) + (gameOpen(g) ? ` · <span class="open">${gameOpen(g)} avointa vuoroa</span>` : "") })).join("")}</div>`;
    } else b += `<p class="note">Kaikki ottelut on pelattu.</p>`;
    b += `<div class="more"><button class="btn ghost sm" data-act="goSec" data-key="ottelut|${esc(s)}">Kaikki ottelut (${games.length}) →</button></div>`;
  }

  // Talkoovuorot
  if (hasTalkoot) {
    b += `<div class="h3">🙋 Talkoovuorot</div>`;
    if (open) {
      const openList = allItems().filter(it => it.date >= t && secName(it.ref) === s &&
        (it.kind === "game" ? gameOpen(it.ref) : it.kind === "talkoo" ? talkooOpen(it.ref) : 0));
      b += `<div class="box">${openList.slice(0, 5).map(it => {
        const what = it.kind === "game" ? Object.keys(it.ref.roles).filter(r => !it.ref.roles[r]).join(", ") : `${talkooOpen(it.ref)} ${secLocked ? "jakamatta" : "vapaana"}`;
        return miniRow(Object.assign({}, it, { extra: secLocked ? `<span class="muted">Jakamatta: ${esc(what)}</span>` : `<span class="open">${esc(what)}</span>` }));
      }).join("")}${openList.length > 5 ? `<div class="small muted" style="padding-top:6px;">+ ${openList.length - 5} muuta</div>` : ""}</div>`;
    } else b += `<div class="banner ok" style="margin-bottom:4px;">✅ Kaikki vuorot ${secLocked ? "jaettu" : "täytetty — kiitos"}!</div>`;
    if (secLocked) b += `<p class="note" style="margin:6px 2px 0;">🔒 Vuorot jakaa talkoovastaava.</p>`;
    b += `<div class="more"><button class="btn sm ${secLocked ? "ghost" : ""}" data-act="goSec" data-key="talkoot|${esc(s)}">${secLocked ? "Näytä vuorot →" : "Ilmoittaudu talkoisiin →"}</button></div>`;
  }

  // Tapahtumat
  if (upEvs.length) {
    b += `<div class="h3">📌 Tapahtumat</div><div class="box">${upEvs.slice(0, 4).map(e => miniRow({ kind: "event", date: e.date, time: e.time, title: e.title, ref: e,
      extra: esc([e.type, e.place].filter(Boolean).join(" · ")) })).join("")}</div>`;
  }

  // Kyydit
  const targets = rideTargets().filter(x => x.date >= t && secName(x.ref) === s);
  if (targets.length) {
    const rides = targets.reduce((a, x) => a.concat(ridesFor(x.id)), []);
    const free = rides.reduce((n, r) => n + Math.max(r.seats - r.passengers.length, 0), 0);
    b += `<div class="h3">🚗 Kyydit</div><div class="box small">${targets.length} ${targets.length === 1 ? "kohde" : "kohdetta"} ·
      ${rides.length ? `${rides.length} ${rides.length === 1 ? "kyytitarjous" : "kyytitarjousta"}, vapaita paikkoja ${free}` : "ei vielä kyytitarjouksia"}
      <div class="more"><button class="btn navy ghost sm" data-act="goSec" data-key="kyydit|${esc(s)}">Kyydit →</button></div></div>`;
  }

  return `<section class="sec sec-${color}">
    <div class="sech"><div><div class="sect">${secIcon(s)} ${esc(s)}</div>${metaBits ? `<div class="secm">${esc(metaBits)}</div>` : ""}</div>
      ${hasTalkoot ? `<span class="secpill ${open && !secLocked ? "" : "ok"}">${secLocked ? (open ? `🔒 ${open} jakamatta` : "🔒 jaettu") : open ? `🙋 ${open} avointa` : "✓ täynnä"}</span>` : ""}</div>

}

// ─── Minun tehtävät ──────────────────────────────────────────────────────
function allNames() {
  const m = new Map();
  const add = n => { n = String(n || "").trim(); if (n && !m.has(n.toLowerCase())) m.set(n.toLowerCase(), n); };
  D.games.forEach(g => Object.values(g.roles).forEach(add));
  D.talkoot.forEach(x => x.names.forEach(add));
  (D.rides || []).forEach(r => { add(r.driver); r.passengers.forEach(add); });
  return [...m.values()].sort((a, b) => a.localeCompare(b, "fi"));
}
function placeLink(name) {
  if (!name) return "";

  return `📍 <a class="lnk" href="${esc(mapUrl(f && f.address ? f.address : name))}" target="_blank" rel="noopener">${esc(name)}</a>`;
}
function myShifts(me, withPast) {
  const q = String(me || "").trim().toLowerCase();
  if (!q) return [];
  const hit = n => String(n || "").trim().toLowerCase() === q;
  const t = todayIso(), ok = d => withPast || d >= t, out = [];
  const where = (x, place, pre) => [pre, secName(x) !== OTHER ? esc(secName(x)) : "", placeLink(place)].filter(Boolean).join(" · ");
  D.games.filter(g => ok(g.date)).forEach(g => Object.keys(g.roles).forEach(r => {
    if (hit(g.roles[r])) out.push({ kind: "game", id: g.id + "-" + r, date: g.date, time: g.time, title: g.teams, icsTitle: `${r}: ${g.teams}`,
      place: g.field, ref: g, extra: where(g, g.field, `<b>${esc(r)}</b>`) });
  }));
  D.talkoot.filter(x => ok(x.date) && x.names.some(hit)).forEach(x => out.push({ kind: "talkoo", id: x.id, date: x.date, time: x.time, end: x.end,
    title: (x.task || "Talkoot") + (x.event ? " – " + x.event : ""), place: x.place, ref: x,
    extra: where(x, x.place, x.time ? `klo ${esc(x.time)}${x.end ? "–" + esc(x.end) : ""}` : "") }));
  const targets = rideTargets();
  (D.rides || []).forEach(r => {
    const tg = targets.find(x => x.id === r.target);
    if (!tg || !ok(tg.date)) return;
    const dep = r.depart ? " · lähtö " + esc(r.depart) : "";
    if (hit(r.driver)) out.push({ kind: "ride", id: r.id, date: tg.date, time: tg.time, title: "Kuljettajana: " + tg.title, place: tg.place, ref: tg.ref,
      extra: `<b>${r.passengers.length}/${r.seats} kyytiläistä</b>${r.passengers.length ? " (" + esc(r.passengers.join(", ")) + ")" : ""}${dep}` });
    r.passengers.filter(hit).forEach(() => out.push({ kind: "ride", id: r.id + "-p", date: tg.date, time: tg.time, title: "Kyydissä: " + tg.title, place: tg.place, ref: tg.ref,
      extra: `Kuljettaja <b>${esc(r.driver)}</b>${dep}` }));
  });
  return out.sort(byWhen);
}
function myBlock() {
  const me = myName(), names = allNames();

  let h = `<div class="h2 navy">👤 Minun tehtävät</div><div class="box">`;
  if (!names.length) return h + `<p class="small muted">Kun vuoroja on jaettu tai kyytejä sovittu, valitse tästä nimesi ja näet omat tehtäväsi.</p></div>`;
  h += `<label class="small muted" for="meSel" style="font-weight:700;">Valitse nimesi</label>
        <select id="meSel" class="inp wide" style="margin:3px 0 6px;background:#fff;">

          ${names.map(n => `<option value="${esc(n)}" ${n.toLowerCase() === me.toLowerCase() ? "selected" : ""}>${esc(n)}</option>`).join("")}
        </select>`;
  if (!me) return h + `<p class="small muted">Nimi muistetaan tällä laitteella.</p></div>`;
  const list = myShifts(me, F.mePast);
  const upcoming = F.mePast ? list.filter(x => x.date >= todayIso()) : list;
  h += `<div class="chips" style="margin:2px 0 4px;"><button class="chip ${F.mePast ? "on" : ""}" data-act="mePast">Näytä myös menneet</button>
        ${list.length ? `<button class="chip" data-act="icsMine">📅 Omat kalenteriin</button>` : ""}</div>`;
  if (!list.length) return h + `<p class="small muted">Ei ${F.mePast ? "" : "tulevia "}tehtäviä nimellä ${esc(me)}.</p></div>`;
  h += `<div class="small" style="margin:4px 2px 2px;"><b>${upcoming.length}</b> tulevaa tehtävää${upcoming.length ? ` · seuraava ${relDay(upcoming[0].date, upcoming[0].time).toLowerCase() || dayLabel(upcoming[0].date)}` : ""}</div>`;
  h += list.map(it => miniRow(it).replace('<div class="mini">', `<div class="mini" style="${it.date < todayIso() ? "opacity:.5;" : ""}">`)).join("");
  return h + `</div>`;
}

function viewOttelut() {

function viewTalkoot() {

    D.games.filter(g => Object.keys(g.roles).length).map(g => ({ kind: "game", date: g.date, time: g.time, ref: g, open: gameOpen(g) })),

// ─── Leirit ──────────────────────────────────────────────────────────────
function isCamp(s) { return s !== OTHER && ((D.camps || []).some(c => c.section === s) || /leiri/i.test(s)); }
function campInfo(s) {
  const c = (D.camps || []).find(x => x.section === s) || {};
  const dates = [].concat(D.games, D.talkoot, D.events, D.menu || []).filter(x => secName(x) === s).map(x => x.date).sort();
  return Object.assign({ name: "", info: "", link: "", town: "" }, c, { start: c.start || dates[0] || "", end: c.end || c.start || dates[dates.length - 1] || "" });
}
// Leirin nimi + paikkakunta ilman toistoa (esim. "Naperoleiri Laitila", ei "Naperoleiri Laitila · Laitila")
function campLabel(s) { const c = campInfo(s); return [c.name, c.town && !c.name.toLowerCase().includes(c.town.toLowerCase()) ? c.town : ""].filter(Boolean).join(", "); }
function campRange(s) { const c = campInfo(s); return !c.start ? "" : c.start === c.end ? dayLabel(c.start) : dm(c.start) + "–" + dm(c.end); }
function campLive(s) { const c = campInfo(s), t = todayIso(); return !!c.start && c.start <= t && t <= c.end; }
function campVisible(s) {
  const c = campInfo(s), t = todayIso(), n = (D.settings && D.settings.campDays) || 14;
  return !!c.start && t <= c.end && daysUntil(c.start) <= n;
}
function campDays(s) {
  const c = campInfo(s); if (!c.start) return [];
  const out = []; let d = dOf(c.start); const e = dOf(c.end);
  while (d <= e && out.length < 21) { out.push(isoOf(d)); d = new Date(d.getTime() + 864e5); }
  return out;
}
const MEAL_ICONS = { aamupala: "☀️", lounas: "🍴", välipala: "🍎", päivällinen: "🍽️", iltapala: "🥪" };
function mealIcon(m) { return MEAL_ICONS[String(m || "").toLowerCase()] || "🍽️"; }
function sortMin(t) { const m = String(t || "").match(/(\d{1,2})(?:[:.](\d{2}))?/); return m ? +m[1] * 60 + (+m[2] || 0) : 9999; }
function fmtSpan(a, b) { return a ? esc(a) + (b ? "–" + esc(b) : "") : ""; }

function campDayRows(s, iso) {
  const rows = [];
  D.games.filter(g => secName(g) === s && g.date === iso).forEach(g => rows.push({ t: g.time, cls: "", ic: "⚾",
    title: esc(g.teams) + (g.result ? ` <span class="badge b-res">${esc(g.result)}</span>` : ""),
    sub: [g.field ? placeLink(g.field) : "", g.info ? esc(g.info) : "", g.link ? `<a class="lnk" href="${esc(g.link)}" target="_blank" rel="noopener">📋 Pesistulokset</a>` : ""].filter(Boolean).join("<br>") }));
  D.events.filter(e => secName(e) === s && e.date === iso).forEach(e => rows.push({ t: e.time, end: e.end, cls: "", ic: eventIcon(e), title: esc(e.title),
    sub: [e.place ? placeLink(e.place) : "", e.info ? esc(e.info) : "", e.link ? `<a class="lnk" href="${esc(e.link)}" target="_blank" rel="noopener">🔗 Lisätiedot</a>` : ""].filter(Boolean).join("<br>") }));
  (D.menu || []).filter(m => secName(m) === s && m.date === iso).forEach(m => rows.push({ t: m.time, cls: "meal", ic: mealIcon(m.meal), title: esc(m.meal || "Ruokailu"),
    sub: [m.food ? esc(m.food) : "", m.place ? placeLink(m.place) : ""].filter(Boolean).join("<br>") }));
  D.talkoot.filter(x => secName(x) === s && x.date === iso).forEach(x => rows.push({ t: x.time, end: x.end, cls: "", ic: "🙋", title: "Talkoot: " + esc(x.task || "vuoro"),
    sub: [`${x.names.length}/${x.need}${x.names.length ? " · " + esc(x.names.join(", ")) : ""}`, x.place ? placeLink(x.place) : ""].filter(Boolean).join(" · ") }));
  return rows.sort((a, b) => sortMin(a.t) - sortMin(b.t));
}
function tlHtml(rows, iso) {
  const now = nowFi(), nowMin = now.getHours() * 60 + now.getMinutes(), t = todayIso();
  return rows.map(r => {
    const past = iso < t || (iso === t && sortMin(r.end || r.t) + (r.end ? 0 : 60) < nowMin && sortMin(r.t) !== 9999);
    return `<div class="tl ${r.cls} ${past ? "past" : ""}"><div class="tt">${r.t ? fmtSpan(r.t, r.end && !String(r.t).includes("–") ? r.end : "") : "—"}</div>
      <div class="tic">${r.ic}</div><div class="tc"><div class="tti">${r.title}</div>${r.sub ? `<div class="tsu">${r.sub}</div>` : ""}</div></div>`;
  }).join("");
}

function viewLeiri() {
  const s = F.leiri;
  if (!s || !sectionList().includes(s)) return `<div class="back"><button class="btn ghost sm" data-act="tab" data-key="koti">← Etusivu</button></div><p class="note">Leiriä ei löytynyt.</p>`;
  const c = campInfo(s), days = campDays(s), t = todayIso();
  const menu = (D.menu || []).filter(m => secName(m) === s);
  const talk = D.talkoot.filter(x => secName(x) === s);
  const gamesWithRoles = D.games.filter(g => secName(g) === s && Object.keys(g.roles).length);
  const targets = rideTargets().filter(x => secName(x.ref) === s);
  const ohjeet = (D.ohjeet || []).filter(o => secName(o) === s);
  const infoTabs = [
    menu.length ? ["ruoka", "🍽️ Ruokalista"] : null,
    ["paikat", "📍 Paikat"],
    talk.length || gamesWithRoles.length ? ["talkoot", "🙋 Talkoot"] : null,
    targets.length ? ["kyydit", "🚗 Kyydit"] : null,
    ["info", "ℹ️ Info"],
  ].filter(Boolean);
  const valid = days.concat(infoTabs.map(x => x[0]));
  if (!valid.includes(F.lday)) F.lday = days.includes(t) ? t : days.find(d => d >= t) || days[0] || "info";
  const st = secStatus(s);

  let h = statusBanners();
  h += `<div class="back"><button class="btn ghost sm" data-act="tab" data-key="koti">← Etusivu</button></div>`;
  h += `<div class="sec sec-${secColor(s)} camphead"><div class="sech"><div><div class="sect">⛺ ${esc(s)}</div>
        <div class="secm">${esc([campLabel(s), campRange(s)].filter(Boolean).join(" · "))}${campLive(s) ? " · käynnissä" : c.start > t ? ` · alkaa ${daysUntil(c.start) === 1 ? "huomenna" : daysUntil(c.start) + " päivän päästä"}` : ""}</div></div>
        ${st.has ? `<span class="secpill ${st.open && !st.locked ? "" : "ok"}">${st.locked ? (st.open ? `🔒 ${st.open} jakamatta` : "🔒 jaettu") : st.open ? `🙋 ${st.open} avointa` : "✓ täynnä"}</span>` : ""}</div></div>`;
  if (days.length) h += chips("lday", days.map(d => [d, dayLabel(d) + (d === t ? " •" : "")]), F.lday);
  h += chips("lday", infoTabs, F.lday);

  const v = F.lday;
  if (days.includes(v)) {
    const rows = campDayRows(s, v);
    h += `<div class="h3">${esc(dayLabel(v))}${v === t ? " · tänään" : ""}</div>`;
    h += rows.length ? `<div class="box">${tlHtml(rows, v)}</div>` : `<p class="note">Tälle päivälle ei ole vielä ohjelmaa.</p>`;
  } else if (v === "ruoka") {
    const byDay = {};
    menu.slice().sort((a, b) => a.date.localeCompare(b.date) || sortMin(a.time) - sortMin(b.time)).forEach(m => (byDay[m.date] = byDay[m.date] || []).push(m));
    Object.keys(byDay).forEach(d => {
      h += `<div class="h3">${esc(dayLabel(d))}${d === t ? " · tänään" : ""}</div><div class="box">${tlHtml(byDay[d].map(m => ({ t: m.time, cls: "meal", ic: mealIcon(m.meal),
        title: esc(m.meal || "Ruokailu"), sub: [m.food ? esc(m.food) : "", m.place ? placeLink(m.place) : ""].filter(Boolean).join("<br>") })), d)}</div>`;
    });
  } else if (v === "paikat") {
    const names = [...new Set([].concat(
      D.games.filter(g => secName(g) === s).map(g => g.field), D.events.filter(e => secName(e) === s).map(e => e.place),
      menu.map(m => m.place), talk.map(x => x.place)).filter(Boolean))];
    h += names.length ? names.map(n => `<div class="card"><div class="cbody"><div class="title">${placeHtml(n)}</div></div></div>`).join("")
      : `<p class="note">Paikkoja ei ole vielä lisätty. Kirjoita paikka otteluun, tapahtumaan tai ruokalistaan, ja sen osoite Kentät-välilehdelle.</p>`;
  } else if (v === "talkoot") {
    if (secLockedName(s) && !locked()) h += `<div class="banner lock">🔒 Leirin vuorot jakaa talkoovastaava.</div>`;
    const items = [].concat(gamesWithRoles.map(g => ({ date: g.date, time: g.time, html: gameCard(g, { noRides: true }) })),
      talk.map(x => ({ date: x.date, time: x.time, html: talkooCard(x) }))).sort(byWhen);
    h += items.map(i => i.html).join("");
  } else if (v === "kyydit") {

      <div class="cbody"><div class="meta" style="color:var(--navy);">${tg.time ? "klo " + esc(tg.time) : ""}</div><div class="title">${esc(tg.title)}</div>
      ${tg.place ? `<div class="sub">${placeHtml(tg.place)}</div>` : ""}${rideBlock(tg)}</div></div>`).join("");
  } else if (v === "info") {
    if (c.info || c.link) h += `<div class="box" style="white-space:pre-line;font-size:14px;line-height:1.55;">${esc(c.info)}${c.link ? `${c.info ? "\n" : ""}<a class="lnk" href="${esc(c.link)}" target="_blank" rel="noopener">🔗 Leirin sivut</a>` : ""}</div>`;
    h += ohjeet.map(ohjeCard).join("");
    if (!c.info && !c.link && !ohjeet.length) h += `<p class="note">Leirin tiedot kirjoitetaan Sheetin Leirit-välilehdelle ja leirin ohjeet Ohjeet-välilehdelle (Osio = ${esc(s)}).</p>`;
  }
  return h;
}

// ─── Kalenteritiedostot (.ics) ───────────────────────────────────────────
function icsItem(it) {
  const d = it.date.replace(/-/g, "");
  const uid = it.kind + "-" + it.id + "@manse-kausi";
  const loc = it.place ? (fieldByName(it.place) && fieldByName(it.place).address ? it.place + ", " + fieldByName(it.place).address : it.place) : "";
  const clean = s => String(s || "").replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  let start, end;
  if (it.time) {
    const s = toMin(it.time), e = it.end && toMin(it.end) > s ? toMin(it.end) : s + 90;
    const hm = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + String(m % 60).padStart(2, "0") + "00";
    start = `DTSTART:${d}T${hm(s)}`; end = `DTEND:${d}T${hm(Math.min(e, 1439))}`;
  } else {
    const n = new Date(dOf(it.date).getTime() + 864e5);
    start = `DTSTART;VALUE=DATE:${d}`; end = `DTEND;VALUE=DATE:${isoOf(n).replace(/-/g, "")}`;
  }
  return ["BEGIN:VEVENT", "UID:" + uid, "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
          start, end, "SUMMARY:" + clean(it.title), loc ? "LOCATION:" + clean(loc) : "", "END:VEVENT"].filter(Boolean).join("\r\n");
}
function downloadIcs(items, filename) {
  const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Manse//Kausi//FI", "CALSCALE:GREGORIAN"]
    .concat(items.map(icsItem), ["END:VCALENDAR"]).join("\r\n");
  const url = URL.createObjectURL(new Blob([body], { type: "text/calendar;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function demoHandle(b) {

  if (b.action === "role") {
    const g = D.games.find(x => x.id === b.id); if (!g) return { ok: false, error: "Ottelua ei löytynyt." };
    if (g.date < t) return { ok: false, error: "Ottelu on jo pelattu." };
    g.roles[b.role] = name; return { ok: true };
  }
  if (b.action === "talkoo_add" || b.action === "talkoo_remove") {
    const x = D.talkoot.find(y => y.id === b.id); if (!x) return { ok: false, error: "Vuoroa ei löytynyt." };
    if (b.action === "talkoo_add") {
      if (x.names.some(n => n.toLowerCase() === name.toLowerCase())) return { ok: true };
      if (x.names.length >= x.need) return { ok: false, error: "Vuoro ehti juuri täyttyä." };
      x.names.push(name);
    } else x.names = x.names.filter(n => n !== name);
    return { ok: true };
  }
  if (b.action === "ride_add") { D.rides.push({ id: "k" + Date.now(), target: b.target, driver: b.driver, seats: b.seats, passengers: [], depart: b.depart || "", info: "" }); return { ok: true }; }
  const r = D.rides.find(y => y.id === b.id); if (!r) return { ok: false, error: "Kyytiä ei löytynyt." };
  if (b.action === "ride_remove") { D.rides = D.rides.filter(y => y !== r); return { ok: true }; }
  if (b.action === "ride_join") {
    if (r.passengers.length >= r.seats) return { ok: false, error: "Kyyti ehti juuri täyttyä." };
    if (!r.passengers.some(n => n.toLowerCase() === name.toLowerCase())) r.passengers.push(name); return { ok: true };
  }
  if (b.action === "ride_leave") { r.passengers = r.passengers.filter(n => n !== name); return { ok: true }; }
  return { ok: false, error: "Tuntematon toiminto." };
}

// ─── Käynnistys ──────────────────────────────────────────────────────────
render();
load();
setInterval(() => { if (!editing && !busy && document.visibilityState === "visible") load(); }, 60000);
setInterval(renderClock, 15000);
</script>
